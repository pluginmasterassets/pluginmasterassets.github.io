<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Master - Professional Unity Plugins</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Header -->
    <header class="navbar">
        <!-- Single row: Logo + Product nav links -->
        <div class="navbar-top">
            <div class="navbar-top-inner">
                <div class="navbar-left">
                    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
                        <span></span><span></span><span></span>
                    </button>
                    <a href="#PWB" class="navbar-logo">
                        <img src="pm_logo_50.png" alt="Plugin Master" class="logo-img">
                    </a>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="#PWB" class="nav-link">Prefab World Builder</a></li>
                    <li class="nav-item"><a href="#TT" class="nav-link">Transform Tools</a></li>
                    <li class="nav-item"><a href="#PMS" class="nav-link">Play Mode Save</a></li>
                    <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Mobile nav drawer -->
    <div class="mobile-drawer" id="mobile-drawer" aria-hidden="true">
        <div class="mobile-drawer-overlay" id="drawer-overlay"></div>
        <nav class="mobile-drawer-panel">
            <button class="mobile-drawer-close" aria-label="Close menu">&#x2715;</button>
            <ul class="mobile-nav-menu">
                <li><a href="#PWB" class="mobile-nav-link">Prefab World Builder</a></li>
                <li><a href="#TT" class="mobile-nav-link">Transform Tools</a></li>
                <li><a href="#PMS" class="mobile-nav-link">Play Mode Save</a></li>
                <li><a href="#contact" class="mobile-nav-link">Contact</a></li>
            </ul>
        </nav>
    </div>

    <!-- Dynamic Content Area -->
    <div id="page-content">
        <!-- Content is loaded here by the router -->
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; Plugin Master. All rights reserved.</p>
            <p>Professional tools for Unity3D development.</p>
        </div>
    </footer>

    <script>
        const routes = {
            'PWB':     'pages/PWB/PWB.html',
            'TT':  'pages/TT/TT.html',
            'PMS':  'pages/PMS/PMS.html',
            'contact':    'pages/contact.html',
        };

        const contentEl = document.getElementById('page-content');

        async function loadPage(hash) {
            const key = (hash || '').replace('#', '') || 'PWB';
            const url = routes[key] || routes['PWB'];

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Not found');
                contentEl.innerHTML = await response.text();

                // Re-execute inline scripts (innerHTML doesn't run them)
                contentEl.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    [...oldScript.attributes].forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch {
                contentEl.innerHTML = '<p style="padding:2rem;text-align:center;">Page not found.</p>';
            }

            // Update active nav link
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('nav-link--active', link.getAttribute('href') === '#' + key);
            });
        }

        window.addEventListener('hashchange', () => loadPage(location.hash));
        loadPage(location.hash);

        // --- Mobile drawer ---
        const drawer     = document.getElementById('mobile-drawer');
        const overlay    = document.getElementById('drawer-overlay');
        const toggleBtn  = document.querySelector('.menu-toggle');
        const closeBtn   = document.querySelector('.mobile-drawer-close');

        function openDrawer() {
            drawer.classList.add('is-open');
            drawer.setAttribute('aria-hidden', 'false');
            toggleBtn.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
        }
        function closeDrawer() {
            drawer.classList.remove('is-open');
            drawer.setAttribute('aria-hidden', 'true');
            toggleBtn.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';
        }

        toggleBtn.addEventListener('click', openDrawer);
        closeBtn.addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);
        document.querySelectorAll('.mobile-nav-link').forEach(link => {
            link.addEventListener('click', closeDrawer);
        });
    </script>
</body>
</html>
