<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Master - Professional Unity Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Header -->
    <header class="navbar">
        <!-- Top row: Logo + Utility -->
        <div class="navbar-top">
            <div class="navbar-top-inner">
                <a href="#prefab" class="navbar-logo">
                    <img src="pm_logo_50.png" alt="Plugin Master" class="logo-img">
                </a>
                <div class="navbar-utility">
                    <a href="https://assetstore.unity.com/publishers/48595" class="btn-store" target="_blank" rel="noopener noreferrer">Unity Asset Store</a>
                </div>
            </div>
        </div>
        <!-- Bottom row: Product nav links -->
        <div class="navbar-bottom">
            <div class="navbar-bottom-inner">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="#PWB" class="nav-link">Prefab World Builder</a></li>
                    <li class="nav-item"><a href="#TT" class="nav-link">Transform Tools</a></li>
                    <li class="nav-item"><a href="#PMS" class="nav-link">Play Mode Save</a></li>
                    <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Dynamic Content Area -->
    <div id="page-content">
        <!-- Content is loaded here by the router -->
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; Plugin Master. All rights reserved.</p>
            <p>Professional tools for Unity3D development.</p>
        </div>
    </footer>

    <script>
        const routes = {
            'PWB':     'pages/PWB/PWB.html',
            'TT':  'pages/TT/TT.html',
            'PMS':  'pages/PMS/PMS.html',
            'contact':    'pages/contact.html',
        };

        const contentEl = document.getElementById('page-content');

        async function loadPage(hash) {
            const key = (hash || '').replace('#', '') || 'PWB';
            const url = routes[key] || routes['PWB'];

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Not found');
                contentEl.innerHTML = await response.text();

                // Re-execute inline scripts (innerHTML doesn't run them)
                contentEl.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    [...oldScript.attributes].forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch {
                contentEl.innerHTML = '<p style="padding:2rem;text-align:center;">Page not found.</p>';
            }

            // Update active nav link
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('nav-link--active', link.getAttribute('href') === '#' + key);
            });
        }

        window.addEventListener('hashchange', () => loadPage(location.hash));
        loadPage(location.hash);
    </script>
</body>
</html>
